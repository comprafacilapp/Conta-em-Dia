

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta em Dia</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f3;
}

.app {
  max-width: 430px;
  min-height: 100vh;
  margin: auto;
  background: white;
}

header {
  background: #1f6f5c;
  color: white;
  text-align: center;
  padding: 28px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

main {
  padding: 20px;
}

.saldo {
  background: #e8f5f0;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
  margin-bottom: 15px;
}

.saldo span {
  display: block;
  color: #555;
}

.saldo strong {
  display: block;
  margin-top: 8px;
  font-size: 32px;
  color: #1f6f5c;
}

.resumo {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}

.card {
  flex: 1;
  background: #f1f3f5;
  border-radius: 15px;
  padding: 18px 10px;
  text-align: center;
}

.card span {
  display: block;
  color: #666;
  font-size: 13px;
}

.card strong {
  display: block;
  margin-top: 7px;
  font-size: 18px;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  background: #1f6f5c;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.formulario {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #f1f3f5;
  border-radius: 15px;
}

.formulario.ativo {
  display: block;
}

.formulario h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

.formulario button {
  margin-top: 18px;
}

.fechar {
  background: #777;
}

.gasto {
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  background: #fff4d6;
  text-align: center;
}

.gasto strong {
  display: block;
  margin-top: 8px;
  font-size: 26px;
}

.mensagem {
  display: none;
  margin-top: 12px;
  padding: 10px;
  background: #dff3e9;
  border-radius: 8px;
  text-align: center;
}

.lista {
  margin-top: 15px;
}

.item {
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
}

.item strong {
  display: block;
}

.item small {
  color: #666;
}

/* HISTÓRICO */

.historico {
  margin-top: 20px;
}

.historico h2 {
  font-size: 20px;
}

.historico-item {
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.entrada {
  color: #16834b;
}

.despesa {
  color: #c0392b;
}
  .filtro-mes {
  margin-bottom: 15px;
  padding: 12px;
  background: white;
  border-radius: 12px;
}

.filtro-mes label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

.filtro-mes input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>Conta em Dia</h1>
<p>Organize sua vida financeira</p>
</header>

<main>
<section class="filtro-mes">

  <label for="mesSelecionado">
    📅 Mês
  </label>

  <input
    id="mesSelecionado"
    onchange="atualizarTela()"
    type="month"
  >

</section>
  
<section class="saldo">
<span>Saldo disponível</span>
<strong id="saldo">R$ 0,00</strong>
</section>

<section class="resumo">

<div class="card">
<span>Entradas</span>
<strong id="entradas">R$ 0,00</strong>
</div>

<div class="card">
<span>Saídas</span>
<strong id="saidas">R$ 0,00</strong>
</div>
<div class="card">
<span>Despesas</span>
<strong id="totalDespesas">R$ 0,00</strong>
</div>

<div class="card">
<span>Contas</span>
<strong id="totalContas">R$ 0,00</strong>
</div>
</section>

<section class="menu">

<button onclick="abrirEntrada()">
💰 Adicionar entrada
</button>

<button onclick="abrirDespesa()">
🛒 Adicionar despesa
</button>

<button onclick="abrirContas()">
📅 Minhas contas
</button>

<button onclick="mostrarHistorico()">
📋 Histórico
</button>

</section>


<!-- ENTRADA -->

<section id="entrada" class="formulario">

<h2>Adicionar entrada</h2>

<label>Descrição</label>

<input
id="descricaoEntrada"
type="text"
placeholder="Ex.: Salário"
>

<label>Valor</label>

<input
id="valorEntrada"
type="number"
placeholder="Ex.: 3500"
step="0.01"
>

<label>Data</label>

<input
id="dataEntrada"
type="date"
>

<button onclick="salvarEntrada()">
Salvar entrada
</button>

<button class="fechar" onclick="fecharTudo()">
Fechar
</button>

<div id="mensagemEntrada" class="mensagem"></div>

</section>


<!-- DESPESA -->

<section id="despesa" class="formulario">

<h2>Adicionar despesa</h2>

<label>Descrição</label>

<input
id="descricaoDespesa"
type="text"
placeholder="Ex.: Mercado"
>

<label>Valor</label>

<input
id="valorDespesa"
type="number"
placeholder="Ex.: 150"
step="0.01"
>

<label>Data</label>

<input
id="dataDespesa"
type="date"
>

<button onclick="salvarDespesa()">
Salvar despesa
</button>

<button class="fechar" onclick="fecharTudo()">
Fechar
</button>

<div id="mensagemDespesa" class="mensagem"></div>

</section>


<!-- CONTAS -->

<section id="contas" class="formulario">

<h2>Minhas contas</h2>

<label>Nome da conta</label>

<input
id="nomeConta"
type="text"
placeholder="Ex.: Conta de luz"
>

<label>Valor</label>

<input
id="valorConta"
type="number"
placeholder="Ex.: 120"
step="0.01"
>

<label>Vencimento</label>

<input
id="dataConta"
type="date"
>

<button onclick="salvarConta()">
Salvar conta
</button>

<button class="fechar" onclick="fecharTudo()">
Fechar
</button>

<div id="listaContas" class="lista"></div>

</section>


<!-- HISTÓRICO -->

<section id="historico" class="formulario">

<h2>Histórico</h2>

<div id="listaHistorico"></div>

<button class="fechar" onclick="fecharTudo()">
Fechar
</button>

</section>


<section class="gasto">

<span>Quanto posso gastar hoje?</span>

<strong id="gastoHoje">
R$ 0,00
</strong>

</section>

</main>

</div>


<script>

let entradas =
JSON.parse(localStorage.getItem("entradasContaEmDia")) || [];

let despesas =
JSON.parse(localStorage.getItem("despesasContaEmDia")) || [];

let contas =
JSON.parse(localStorage.getItem("contasContaEmDia")) || [];


function dinheiro(valor) {

return valor.toLocaleString(
"pt-BR",
{
style: "currency",
currency: "BRL"
}
);

}


function salvarDados() {

localStorage.setItem(
"entradasContaEmDia",
JSON.stringify(entradas)
);

localStorage.setItem(
"despesasContaEmDia",
JSON.stringify(despesas)
);

localStorage.setItem(
"contasContaEmDia",
JSON.stringify(contas)
);

}


function atualizarTela() {

let campoMes =
document.getElementById("mesSelecionado");

if (!campoMes.value) {

let hoje = new Date();

let ano = hoje.getFullYear();

let mes =
String(hoje.getMonth() + 1).padStart(2, "0");

campoMes.value =
ano + "-" + mes;

}

let mesSelecionado =
campoMes.value;


let totalEntradas = 0;

let totalDespesas = 0;

let totalContas = 0;


entradas.forEach(function(item) {

if (
item.data &&
item.data.startsWith(mesSelecionado)
) {

totalEntradas += Number(item.valor);

}

});


despesas.forEach(function(item) {

if (
item.data &&
item.data.startsWith(mesSelecionado)
) {

totalDespesas += Number(item.valor);

}

});


contas.forEach(function(item) {

if (
item.data &&
item.data.startsWith(mesSelecionado)
) {

totalContas += Number(item.valor);

}

});


let totalSaidas =
totalDespesas + totalContas;


let saldo =
totalEntradas - totalSaidas;


document.getElementById("entradas")
.innerText = dinheiro(totalEntradas);


document.getElementById("saidas")
.innerText = dinheiro(totalSaidas);
document.getElementById("totalDespesas")
.innerText = dinheiro(totalDespesas);

document.getElementById("totalContas")
.innerText = dinheiro(totalContas);

document.getElementById("saldo")
.innerText = dinheiro(saldo);


let gastoHoje = 0;


if (saldo > 0) {

gastoHoje = saldo / 30;

}


document.getElementById("gastoHoje")
.innerText = dinheiro(gastoHoje);


mostrarContas();

mostrarHistoricoInterno();

}


function fecharTudo() {

document
.querySelectorAll(".formulario")
.forEach(function(item) {

item.classList.remove("ativo");

});

}


function abrirEntrada() {

fecharTudo();

document
.getElementById("entrada")
.classList.add("ativo");

}


function abrirDespesa() {

fecharTudo();

document
.getElementById("despesa")
.classList.add("ativo");

}


function abrirContas() {

fecharTudo();

document
.getElementById("contas")
.classList.add("ativo");

}


function salvarEntrada() {

let descricao =
document.getElementById(
"descricaoEntrada"
).value;

let valor =
Number(
document.getElementById(
"valorEntrada"
).value
);

let data =
document.getElementById(
"dataEntrada"
).value;


if (
descricao === "" ||
valor <= 0
) {

alert(
"Preencha a descrição e o valor."
);

return;

}


entradas.push({

descricao: descricao,

valor: valor,

data: data

});


salvarDados();

atualizarTela();


document.getElementById(
"descricaoEntrada"
).value = "";

document.getElementById(
"valorEntrada"
).value = "";

document.getElementById(
"dataEntrada"
).value = "";


document.getElementById(
"mensagemEntrada"
).innerText =
"Entrada salva com sucesso!";


document.getElementById(
"mensagemEntrada"
).style.display =
"block";

}


function salvarDespesa() {

let descricao =
document.getElementById(
"descricaoDespesa"
).value;

let valor =
Number(
document.getElementById(
"valorDespesa"
).value
);

let data =
document.getElementById(
"dataDespesa"
).value;


if (
descricao === "" ||
valor <= 0
) {

alert(
"Preencha a descrição e o valor."
);

return;

}


despesas.push({

descricao: descricao,

valor: valor,

data: data

});


salvarDados();

atualizarTela();


document.getElementById(
"descricaoDespesa"
).value = "";

document.getElementById(
"valorDespesa"
).value = "";

document.getElementById(
"dataDespesa"
).value = "";


document.getElementById(
"mensagemDespesa"
).innerText =
"Despesa salva com sucesso!";


document.getElementById(
"mensagemDespesa"
).style.display =
"block";

}


function salvarConta() {

let nome =
document.getElementById(
"nomeConta"
).value;

let valor =
Number(
document.getElementById(
"valorConta"
).value
);

let data =
document.getElementById(
"dataConta"
).value;


if (
nome === "" ||
valor <= 0
) {

alert(
"Preencha o nome da conta e o valor."
);

return;

}


contas.push({

nome: nome,

valor: valor,

data: data,
paga: false
});



salvarDados();

atualizarTela();


document.getElementById(
"nomeConta"
).value = "";

document.getElementById(
"valorConta"
).value = "";

document.getElementById(
"dataConta"
).value = "";

}


function mostrarContas() {

let lista =
document.getElementById(
"listaContas"
);

lista.innerHTML = "";


let mesSelecionado =
document.getElementById("mesSelecionado").value;

let hoje = new Date();
hoje.setHours(0, 0, 0, 0);

let contasFiltradas =
contas.filter(function(conta) {

if (!conta.data) return false;

let vencimento =
new Date(conta.data + "T00:00:00");

let pertenceAoMes =
conta.data.startsWith(mesSelecionado);

let atrasadaAnterior =
!conta.paga &&
vencimento < hoje &&
!pertenceAoMes;

return pertenceAoMes || atrasadaAnterior;

});


let contasOrdenadas =
[...contasFiltradas].sort(function(a, b) {

if (a.paga && !b.paga) return 1;

if (!a.paga && b.paga) return -1;

if (!a.data && !b.data) return 0;

if (!a.data) return 1;

if (!b.data) return -1;

return new Date(a.data) - new Date(b.data);

});
  contasOrdenadas.forEach(function(conta) {

let item =
document.createElement("div");

item.className = "item";

let hoje = new Date();
hoje.setHours(0, 0, 0, 0);

let vencimento = conta.data
? new Date(conta.data + "T00:00:00")
: null;

let status;

if (conta.paga) {

status = " ✅ PAGA";

} else if (
vencimento &&
vencimento < hoje
) {

status = " ⚠️ ATRASADA";

} else if (
vencimento &&
vencimento.getTime() === hoje.getTime()
) {

status = " 🔔 VENCE HOJE";

} else if (
vencimento &&
(vencimento - hoje) / 86400000 <= 3
) {

status = " ⏰ VENCE EM BREVE";

} else {

status = " ⏳ EM ABERTO";


}

item.innerHTML =
"<strong>" +
conta.nome +
status +
"</strong>" +
"<small>" +
dinheiro(Number(conta.valor)) +
" • Vencimento: " +
(conta.data
? conta.data.split("-").reverse().join("/")
: "não informado") +
(conta.paga && conta.dataPagamento
? " • Paga em: " +
conta.dataPagamento.split("-").reverse().join("/")
: "") +
"</small>";

if (!conta.paga) {

let botaoPagar =
document.createElement("button");

botaoPagar.innerText =
"✅ Marcar como paga";

botaoPagar.onclick = function() {

conta.paga = true;
conta.dataPagamento =
new Date().toISOString().split("T")[0];
salvarDados();
mostrarContas();
atualizarTela();

};

item.appendChild(botaoPagar);

}
else {

let botaoDesfazer =
document.createElement("button");

botaoDesfazer.innerText =
"↩️ Marcar como não paga";

botaoDesfazer.onclick = function() {

conta.paga = false;

conta.dataPagamento = "";

salvarDados();
mostrarContas();
atualizarTela();

};

item.appendChild(botaoDesfazer);

}

lista.appendChild(item);

});

}


function mostrarHistorico() {

fecharTudo();

document
.getElementById("historico")
.classList.add("ativo");

mostrarHistoricoInterno();

}

function mostrarHistoricoInterno() {

let lista =
document.getElementById(
"listaHistorico"
);

if (!lista) return;

lista.innerHTML = "";

let mesSelecionado =
document.getElementById("mesSelecionado").value;


// ENTRADAS

entradas
.filter(function(item) {

return item.data &&
item.data.startsWith(mesSelecionado);

})
.forEach(function(item) {

let linha =
document.createElement("div");

linha.className =
"historico-item entrada";

linha.innerText =
"Entrada: " +
item.descricao +
" — " +
dinheiro(Number(item.valor)) +
" — " +
(item.data
? item.data.split("-").reverse().join("/")
: "Data não informada");


let editar =
document.createElement("button");

editar.innerText = "✏️ Editar";

editar.onclick = function() {

let novaDescricao =
prompt(
"Editar descrição:",
item.descricao
);

if (novaDescricao === null) return;

let novoValor =
prompt(
"Editar valor:",
item.valor
);

if (novoValor === null) return;

item.descricao =
novaDescricao;

item.valor =
Number(novoValor);

salvarDados();
mostrarHistoricoInterno();
atualizarTela();

};


let excluir =
document.createElement("button");

excluir.innerText = "🗑️ Excluir";

excluir.onclick = function() {

if (confirm("Excluir esta entrada?")) {

entradas.splice(
entradas.indexOf(item),
1
);

salvarDados();
mostrarHistoricoInterno();
atualizarTela();

}

};

linha.appendChild(editar);
linha.appendChild(excluir);

lista.appendChild(linha);

});


// DESPESAS

despesas
.filter(function(item) {

return item.data &&
item.data.startsWith(mesSelecionado);

})
.forEach(function(item) {

let linha =
document.createElement("div");

linha.className =
"historico-item despesa";

linha.innerText =
"Despesa: " +
item.descricao +
" — " +
dinheiro(Number(item.valor)) +
" — " +
(item.data
? item.data.split("-").reverse().join("/")
: "Data não informada");


let editar =
document.createElement("button");

editar.innerText = "✏️ Editar";

editar.onclick = function() {

let novaDescricao =
prompt(
"Editar descrição:",
item.descricao
);

if (novaDescricao === null) return;

let novoValor =
prompt(
"Editar valor:",
item.valor
);

if (novoValor === null) return;

item.descricao =
novaDescricao;

item.valor =
Number(novoValor);

salvarDados();
mostrarHistoricoInterno();
atualizarTela();

};


let excluir =
document.createElement("button");

excluir.innerText = "🗑️ Excluir";

excluir.onclick = function() {

if (confirm("Excluir esta despesa?")) {

despesas.splice(
despesas.indexOf(item),
1
);

salvarDados();
mostrarHistoricoInterno();
atualizarTela();

}

};

linha.appendChild(editar);
linha.appendChild(excluir);

lista.appendChild(linha);

});


// CONTAS

contas
.filter(function(item) {

return item.data &&
item.data.startsWith(mesSelecionado);

})
.forEach(function(item) {

let linha =
document.createElement("div");

linha.className =
"historico-item despesa";

linha.innerText =
"Conta: " +
item.nome +
" — " +
dinheiro(Number(item.valor)) +
" — " +
(item.data
? item.data.split("-").reverse().join("/")
: "Data não informada");


let editar =
document.createElement("button");

editar.innerText = "✏️ Editar";

editar.onclick = function() {

let novoNome =
prompt(
"Editar nome da conta:",
item.nome
);

if (novoNome === null) return;

let novoValor =
prompt(
"Editar valor:",
item.valor
);

if (novoValor === null) return;

item.nome =
novoNome;

item.valor =
Number(novoValor);

salvarDados();
mostrarHistoricoInterno();
atualizarTela();

};


let excluir =
document.createElement("button");

excluir.innerText = "🗑️ Excluir";

excluir.onclick = function() {

if (confirm("Excluir esta conta?")) {

contas.splice(
contas.indexOf(item),
1
);

salvarDados();
mostrarHistoricoInterno();
atualizarTela();

}

};

linha.appendChild(editar);
linha.appendChild(excluir);

lista.appendChild(linha);

});


  
}
  atualizarTela();

</script>

</body>
</html>
