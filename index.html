<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conta em Dia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f3;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    header {
      background: #1f6f5c;
      color: white;
      text-align: center;
      padding: 28px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      padding: 20px;
    }

    .saldo {
      background: #e8f5f0;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      margin-bottom: 15px;
    }

    .saldo span {
      display: block;
      color: #555;
    }

    .saldo strong {
      display: block;
      margin-top: 8px;
      font-size: 32px;
      color: #1f6f5c;
    }

    .resumo {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      flex: 1;
      background: #f1f3f5;
      border-radius: 15px;
      padding: 18px 10px;
      text-align: center;
    }

    .card span {
      display: block;
      color: #666;
      font-size: 13px;
    }

    .card strong {
      display: block;
      margin-top: 7px;
      font-size: 18px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #1f6f5c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .gasto {
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      background: #fff4d6;
      text-align: center;
    }

    .gasto strong {
      display: block;
      margin-top: 8px;
      font-size: 26px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>Conta em Dia</h1>
      <p>Organize sua vida financeira</p>
    </header>

    <main>

      <section class="saldo">
        <span>Saldo disponível</span>
        <strong>R$ 0,00</strong>
      </section>

      <section class="resumo">

        <div class="card">
          <span>Entradas</span>
          <strong>R$ 0,00</strong>
        </div>

        <div class="card">
          <span>Saídas</span>
          <strong>R$ 0,00</strong>
        </div>

      </section>

      <section class="menu">

        <button>💰 Adicionar entrada</button>

        <button>🛒 Adicionar despesa</button>

        <button>📅 Minhas contas</button>

      </section>

      <section class="gasto">
        <span>Quanto posso gastar hoje?</span>
        <strong>R$ 0,00</strong>
      </section>

    </main>

  </div>

</body>
</html>
